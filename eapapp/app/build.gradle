plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edii.eapregistration'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edii.eapregistration'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '2.4-central-master-only-sync'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
