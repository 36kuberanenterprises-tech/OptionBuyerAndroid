plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edii.eapregistration'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edii.eapregistration'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '2.2-statusbar-splash-fix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
