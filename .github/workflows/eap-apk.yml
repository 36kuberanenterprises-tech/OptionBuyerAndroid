name: Build EAP APK

permissions:
  contents: write

on:
  push:
    branches:
      - eap-registration-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eapapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/EAP_Registration_Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EAP_Registration_Test_APK
          path: eapapp/artifact/EAP_Registration_Test.apk
          if-no-files-found: error


      - name: Publish latest APK to web download page
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin eap-web-app
          rm -rf /tmp/eap-web-publish
          git worktree add /tmp/eap-web-publish origin/eap-web-app
          cp eapapp/app/build/outputs/apk/debug/app-debug.apk /tmp/eap-web-publish/eapweb/public/downloads/HAL_EAP_Registration_Android_latest.apk
          VERSION_NAME=$(awk -F"'" '/versionName/ {print $2; exit}' eapapp/app/build.gradle)
          printf '{"version":"%s"}\n' "$VERSION_NAME" > /tmp/eap-web-publish/eapweb/public/downloads/android-version.json
          cd /tmp/eap-web-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eapweb/public/downloads/HAL_EAP_Registration_Android_latest.apk eapweb/public/downloads/android-version.json
          if git diff --cached --quiet; then
            echo "Latest APK is already current."
          else
            git commit -m "Update latest HAL EAP Android APK"
            git push origin HEAD:eap-web-app
          fi
